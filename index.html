<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro App</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <div class="container">
    <div class="time-displayBox">
      <div class="title-box">Work</div>
      <div id="display">25:00</div>
    </div>
    
    <div class="bottom">
      <button id="startPause">Start</button>
      <button id="resetBtn">Reset</button>
      <button class="detail">&#9776;</button>

      <div class="info hidden">
        <div class="roundBx lists"><span id="round"></span> : Times Completed</div>
        <div class="lists" id="deleteBtn">Clear All Data</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
